name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if GoHighLevel credentials are committed
        # PITs look like pit-<uuid>; location/company ids are 20-char base62.
        # Real ids must never appear in code, fixtures, or docs — config is
        # env-var/flag only (GHL_PIT_TOKEN, GHL_LOCATION_ID).
        run: |
          if grep -rInE "pit-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}" --exclude-dir=.git .; then
            echo "::error::GoHighLevel Private Integration Token found in the repo"
            exit 1
          fi
          echo "no credential patterns found"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, "1.88"] # MSRV
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Both extremes matter: feature-gated generated code can be unused with
      # no features on, and only compiles at all with them on.
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace
      # Feature-gated tests (generated services, webhooks) only compile with
      # their features on, so run them explicitly too.
      - run: cargo test --workspace --all-features
      # Docs are built with every feature on, matching how docs.rs renders them:
      # ghl-models' module-index links only resolve when those modules are compiled.
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
