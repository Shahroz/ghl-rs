name: Release

# Tagging v* builds the ghl-mcp binaries the npm installer and Homebrew expect.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,  target: aarch64-apple-darwin }
          - { os: macos-latest,  target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-linker (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      - run: cargo build --release -p ghl-mcp --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          bin=ghl-mcp
          [ "${{ matrix.os }}" = "windows-latest" ] && bin=ghl-mcp.exe
          tar czf "ghl-mcp-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" "$bin"
      - uses: softprops/action-gh-release@v2
        with:
          files: ghl-mcp-${{ matrix.target }}.tar.gz
          fail_on_unmatched_files: true

  # After the binaries exist, rewrite Formula/ghl-mcp.rb to point at this tag
  # with fresh checksums, so `brew upgrade` picks it up with no manual step.
  homebrew:
    needs: binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump the formula
        run: python3 xtask/bump_formula.py "${GITHUB_REF_NAME#v}"
      - name: Commit if changed
        run: |
          if git diff --quiet Formula/ghl-mcp.rb; then
            echo "formula already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ghl-mcp.rb
          git commit -m "Bump Homebrew formula to ${GITHUB_REF_NAME}"
          git push origin main
