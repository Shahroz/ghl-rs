[package]
name = "ghl-mcp"
description = "MCP server for GoHighLevel CRM — agency-grade, single static binary, built on the official rmcp SDK"
readme = "README.md"
# Binary-only crate: docs.rs doesn't build docs for it, so point the
# crates.io Documentation link at the README instead.
documentation = "https://github.com/Shahroz/ghl-rs/tree/main/crates/ghl-mcp#readme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "ghl-mcp"
path = "src/main.rs"

[dependencies]
ghl-sdk = { workspace = true }
rmcp = { version = "3", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = "0.8"
