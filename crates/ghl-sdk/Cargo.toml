[package]
name = "ghl-sdk"
description = "Unofficial async Rust SDK for the GoHighLevel (HighLevel) API 2.0 — OAuth 2.0, Private Integration Tokens, rate-limit-aware retries, paginated streams"
readme = "README.md"
documentation = "https://docs.rs/ghl-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
secrecy = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
fastrand = { workspace = true }
async-trait = "0.1"
ghl-models = { workspace = true, optional = true }

[dev-dependencies]
wiremock = { workspace = true }
tokio = { version = "1", features = ["full"] }

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# Re-export generated DTOs for the whole API under `ghl_sdk::models`.
# Enable specific modules via ghl-models' own features, e.g.
#   ghl-models = { version = "0.3", features = ["invoices"] }
models = ["dep:ghl-models"]
