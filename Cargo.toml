[workspace]
resolver = "2"
members = ["crates/ghl-models", "crates/ghl-sdk", "crates/ghl-mcp"]

[workspace.package]
version = "0.3.1"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Shahroz/ghl-rs"
authors = ["Shahroz Allauddin"]
keywords = ["gohighlevel", "crm", "api", "mcp", "sdk"]
categories = ["api-bindings"]

[workspace.dependencies]
ghl-sdk = { path = "crates/ghl-sdk", version = "0.3.1" }
ghl-models = { path = "crates/ghl-models", version = "0.3.1", default-features = false }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
secrecy = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tracing = "0.1"
fastrand = "2"

# MCP server
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
schemars = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# dev
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
